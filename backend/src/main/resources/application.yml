spring:
  application:
    name: rag-qa-backend
  datasource:
    url: ${APP_DB_URL:jdbc:mysql://127.0.0.1:3306/rag_qa?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${APP_DB_USERNAME:rag_qa}
    password: ${APP_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  security:
    jwt-secret: ${APP_JWT_SECRET:}
    access-token-minutes: ${APP_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${APP_REFRESH_TOKEN_DAYS:7}
    refresh-cookie-name: rag_qa_refresh
    secure-cookie: ${APP_SECURE_COOKIE:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap-admin:
    username: ${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    display-name: ${APP_BOOTSTRAP_ADMIN_DISPLAY_NAME:系统管理员}
  storage:
    root: ${APP_STORAGE_ROOT:D:/毕业设计/RAG软件工程知识问答系统/data/uploads}
  rag:
    base-url: ${APP_RAG_BASE_URL:http://127.0.0.1:8000}
    service-token: ${APP_RAG_SERVICE_TOKEN:}
    timeout: ${APP_RAG_TIMEOUT:30s}

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
